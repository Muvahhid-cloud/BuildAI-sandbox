# Design systems of buildai-design-systems@1 (Phase 3.5 K3). Editorial drafts.
#
# Types below are VISUAL variants of the generic types (buildai-generic-types@1): same family,
# same dimensions/defaults, same (or no) assembly — only a frame, leaf or railing material/kind
# differs. Families and assemblies are reused from the generic pack; nothing here is
# construction data. Colors are palette names (apps/api/app/modules/building/appearance.py);
# materials are ids of data/materials/library.json.

types:
  - { id: type.door.minimal_entrance, family: family.door.hinged, name: "Entrance door (steel, flush)", params: { element_type: door, door_kind: entrance, height: 2.2, thickness: 0.06, material_id: metal, frame_material_id: window_frame, default_width: 1.0 }, derived_from: { layout_config: [entrance_door, door_thickness] }, provenance: [&ed { source: buildai-editorial, supports: [mapping], note: "Visual variant of a generic type (material only)." }], status: draft }
  - { id: type.door.warm_entrance, family: family.door.hinged, name: Entrance door (oak), params: { element_type: door, door_kind: entrance, height: 2.2, thickness: 0.06, material_id: wood, frame_material_id: wood_dark, default_width: 1.0 }, derived_from: { layout_config: [entrance_door, door_thickness] }, provenance: [*ed], status: draft }
  - { id: type.railing.minimal_stair_glass, family: family.railing.basic, name: Stair railing (glass), params: { element_type: railing, railing_kind: glass, height: 0.9, post_spacing: 1.0, material_id: metal }, derived_from: { layout_config: [stair_railing_height, railing_post_spacing] }, provenance: [*ed], status: draft }
  - { id: type.window.white_frame_standard, family: family.window.basic, name: Standard window (white frame), params: { element_type: window, material_id: glass, frame_material_id: window_frame_white, default_sill: 0.9, default_height: 1.4, glazing_ratio: 0.16, mullion_spacing: 1.0 }, derived_from: { layout_config: [window_presets.standard] }, provenance: [*ed], status: draft }
  - { id: type.window.white_frame_large, family: family.window.basic, name: Large window (white frame), params: { element_type: window, material_id: glass, frame_material_id: window_frame_white, default_sill: 0.6, default_height: 1.8, glazing_ratio: 0.22, mullion_spacing: 1.2 }, derived_from: { layout_config: [window_presets.large] }, provenance: [*ed], status: draft }
  - { id: type.window.white_frame_panoramic, family: family.window.basic, name: Panoramic window (white frame), params: { element_type: window, material_id: glass, frame_material_id: window_frame_white, default_sill: 0.1, default_height: 2.4, glazing_ratio: 0.3, mullion_spacing: 1.4 }, derived_from: { layout_config: [window_presets.panoramic] }, provenance: [*ed], status: draft }
  - { id: type.window.wood_frame_standard, family: family.window.basic, name: Standard window (oak frame), params: { element_type: window, material_id: glass, frame_material_id: wood, default_sill: 0.9, default_height: 1.4, glazing_ratio: 0.16, mullion_spacing: 1.0 }, derived_from: { layout_config: [window_presets.standard] }, provenance: [*ed], status: draft }
  - { id: type.window.wood_frame_large, family: family.window.basic, name: Large window (oak frame), params: { element_type: window, material_id: glass, frame_material_id: wood, default_sill: 0.6, default_height: 1.8, glazing_ratio: 0.22, mullion_spacing: 1.2 }, derived_from: { layout_config: [window_presets.large] }, provenance: [*ed], status: draft }
  - { id: type.window.wood_frame_panoramic, family: family.window.basic, name: Panoramic window (oak frame), params: { element_type: window, material_id: glass, frame_material_id: wood, default_sill: 0.1, default_height: 2.4, glazing_ratio: 0.3, mullion_spacing: 1.4 }, derived_from: { layout_config: [window_presets.panoramic] }, provenance: [*ed], status: draft }

