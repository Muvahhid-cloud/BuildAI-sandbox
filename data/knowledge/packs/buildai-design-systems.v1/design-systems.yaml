design_systems:
  - id: modern-minimal
    name: Modern minimal
    description: >-
      Calm, reduced volumes: smooth render or exposed concrete in white, grey or black (an accent
      color is allowed), large glazing, flat or simple gable roofs, light oak and stone-look
      floors, grey upholstery and a steel entrance door with a glass stair balustrade.
    style_tags: [modern, minimalist, contemporary]
    interior_styles: [minimalist, modern]
    role_mapping: mapping.modern_minimal
    roof: { types: [flat, gable], default: flat }
    windows: { styles: [standard, large, panoramic], default: large }
    facade: { materials: [render, concrete], default_material: render, colors: [white, off_white, light_grey, grey, anthracite, black], default_color: white, custom_colors: true }
    finishes: { dry_floor: oak_light, wet_floor: stone_tile, interior_wall: interior_wall, wet_wall: stone_tile }
    furniture: { upholstery: fabric, upholstery_light: fabric_light, wood: oak_light, wood_dark: wood_dark, cabinet: cabinet, countertop: countertop }
    provenance: [*ed]
    status: draft
  - id: contemporary-warm
    name: Contemporary warm
    description: >-
      Contemporary forms in warm earth tones: beige, sand, ochre or terracotta render, brick or
      timber, gable or hip roofs, oak-framed windows, oak entrance door, warm white walls,
      oak parquet and terracotta upholstery.
    style_tags: [contemporary, modern]
    interior_styles: [modern, cozy, scandinavian]
    role_mapping: mapping.contemporary_warm
    roof: { types: [gable, hip, flat], default: gable, default_pitch_deg: 30 }
    windows: { styles: [standard, large, panoramic], default: large }
    facade: { materials: [render, brick, timber], default_material: render, colors: [warm_beige, sand, off_white, ochre, terracotta, yellow], default_color: warm_beige, custom_colors: false }
    finishes: { dry_floor: parquet, wet_floor: stone_tile, interior_wall: wall_warm, wet_wall: tile }
    furniture: { upholstery: fabric_warm, upholstery_light: fabric_light, wood: wood, wood_dark: wood_dark, cabinet: cabinet, countertop: countertop }
    provenance: [*ed]
    status: draft
  - id: classic-brick
    name: Classic brick
    description: >-
      Traditional massing in exposed brick (or plain render), hip or gable roofs with a clear
      pitch, standard and large windows with white frames, oak parquet and warm upholstery.
      Brick facades keep their own color; there is no facade color palette.
    style_tags: [classic, traditional]
    interior_styles: [classic, cozy]
    role_mapping: mapping.classic_brick
    roof: { types: [hip, gable], default: hip, default_pitch_deg: 35 }
    windows: { styles: [standard, large], default: standard }
    facade: { materials: [brick, render], default_material: brick, colors: [], custom_colors: false }
    finishes: { dry_floor: parquet, wet_floor: tile, interior_wall: interior_wall, wet_wall: tile }
    furniture: { upholstery: fabric_warm, upholstery_light: fabric_light, wood: wood, wood_dark: wood_dark, cabinet: cabinet, countertop: countertop }
    provenance: [*ed]
    status: draft
  - id: scandinavian-timber
    name: Scandinavian timber
    description: >-
      Simple gabled volumes in timber cladding or painted render (white, light grey, sage,
      timber brown, Falu-style red, black), white-framed windows, light oak floors and
      furniture, light textiles.
    style_tags: [scandinavian, minimalist, contemporary]
    interior_styles: [scandinavian, minimalist, cozy]
    role_mapping: mapping.scandinavian_timber
    roof: { types: [gable], default: gable, default_pitch_deg: 35 }
    windows: { styles: [standard, large, panoramic], default: large }
    facade: { materials: [timber, render], default_material: timber, colors: [white, off_white, light_grey, sage_green, timber_brown, brick_red, black], custom_colors: false }
    finishes: { dry_floor: oak_light, wet_floor: stone_tile, interior_wall: interior_wall, wet_wall: tile }
    furniture: { upholstery: fabric_light, upholstery_light: fabric_light, wood: oak_light, wood_dark: wood, cabinet: cabinet, countertop: countertop }
    provenance: [*ed]
    status: draft
