# Families, types, assemblies and the role mapping of buildai-generic-types@1.
# Lengths in meters. `derived_from.layout_config` names the LayoutConfig fields each value was
# migrated from. All records are editorial drafts (no published source).

families:
  - { id: family.wall.basic, name: Basic wall, element_type: wall, class_ref: class.wall, provenance: [&ed { source: buildai-editorial, supports: [mapping], note: "Migrated from the layout engine defaults." }], status: draft }
  - { id: family.slab.basic, name: Basic slab, element_type: slab, class_ref: class.slab, provenance: [*ed], status: draft }
  - { id: family.roof.basic, name: Basic roof, element_type: roof, class_ref: class.roof, provenance: [*ed], status: draft }
  - { id: family.door.hinged, name: Door, element_type: door, class_ref: class.door, provenance: [*ed], status: draft }
  - { id: family.window.basic, name: Window, element_type: window, class_ref: class.window, provenance: [*ed], status: draft }
  - { id: family.stair.straight, name: Straight stair, element_type: stair, class_ref: class.stair, provenance: [*ed], status: draft }
  - { id: family.railing.basic, name: Railing, element_type: railing, class_ref: class.railing, provenance: [*ed], status: draft }

# One structural layer each, material unspecified (the specification does not decide it).
assemblies:
  - { id: assembly.wall.generic_exterior_300, kind: wall, name: Generic exterior wall 300, layers: [{ function: structure, material_id: null, thickness: 0.3 }], total_thickness: 0.3, derived_from: { layout_config: [exterior_wall_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.wall.generic_interior_120, kind: wall, name: Generic interior wall 120, layers: [{ function: structure, material_id: null, thickness: 0.12 }], total_thickness: 0.12, derived_from: { layout_config: [interior_wall_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.floor.generic_ground_300, kind: floor, name: Generic ground slab 300, layers: [{ function: structure, material_id: null, thickness: 0.3 }], total_thickness: 0.3, derived_from: { layout_config: [ground_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.floor.generic_floor_200, kind: floor, name: Generic floor slab 200, layers: [{ function: structure, material_id: null, thickness: 0.2 }], total_thickness: 0.2, derived_from: { layout_config: [floor_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.floor.generic_balcony_200, kind: floor, name: Generic balcony slab 200, layers: [{ function: structure, material_id: null, thickness: 0.2 }], total_thickness: 0.2, derived_from: { layout_config: [balcony_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.floor.generic_terrace_150, kind: floor, name: Generic terrace slab 150, layers: [{ function: structure, material_id: null, thickness: 0.15 }], total_thickness: 0.15, derived_from: { layout_config: [terrace_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: assembly.roof.generic_200, kind: roof, name: Generic roof 200, layers: [{ function: structure, material_id: null, thickness: 0.2 }], total_thickness: 0.2, derived_from: { layout_config: [roof_thickness] }, provenance: [*ed], status: draft }

types:
  # Walls
  - { id: type.wall.generic_exterior_300, family: family.wall.basic, name: Exterior wall 300, params: { element_type: wall, wall_kind: exterior, load_bearing: true }, assembly: assembly.wall.generic_exterior_300, derived_from: { layout_config: [exterior_wall_thickness] }, provenance: [*ed], status: draft }
  - { id: type.wall.generic_interior_120, family: family.wall.basic, name: Interior wall 120, params: { element_type: wall, wall_kind: interior, load_bearing: false }, assembly: assembly.wall.generic_interior_120, derived_from: { layout_config: [interior_wall_thickness] }, provenance: [*ed], status: draft }
  # Slabs
  - { id: type.slab.generic_ground_300, family: family.slab.basic, name: Ground slab 300, params: { element_type: slab, slab_kind: ground }, assembly: assembly.floor.generic_ground_300, derived_from: { layout_config: [ground_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: type.slab.generic_floor_200, family: family.slab.basic, name: Floor slab 200, params: { element_type: slab, slab_kind: floor }, assembly: assembly.floor.generic_floor_200, derived_from: { layout_config: [floor_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: type.slab.generic_balcony_200, family: family.slab.basic, name: Balcony slab 200, params: { element_type: slab, slab_kind: balcony }, assembly: assembly.floor.generic_balcony_200, derived_from: { layout_config: [balcony_slab_thickness] }, provenance: [*ed], status: draft }
  - { id: type.slab.generic_terrace_150, family: family.slab.basic, name: Terrace slab 150, params: { element_type: slab, slab_kind: ground }, assembly: assembly.floor.generic_terrace_150, derived_from: { layout_config: [terrace_slab_thickness] }, provenance: [*ed], status: draft }
  # Roofs
  - { id: type.roof.generic_200, family: family.roof.basic, name: Roof 200, params: { element_type: roof }, assembly: assembly.roof.generic_200, derived_from: { layout_config: [roof_thickness] }, provenance: [*ed], status: draft }
  # Doors
  - { id: type.door.generic_entrance, family: family.door.hinged, name: Entrance door, params: { element_type: door, door_kind: entrance, height: 2.2, thickness: 0.06, material_id: wood_dark, frame_material_id: window_frame, default_width: 1.0 }, derived_from: { layout_config: [entrance_door, door_thickness] }, provenance: [*ed], status: draft }
  - { id: type.door.generic_interior, family: family.door.hinged, name: Interior door, params: { element_type: door, door_kind: interior, height: 2.1, thickness: 0.06, material_id: wood, frame_material_id: window_frame, default_width: 0.9 }, derived_from: { layout_config: [interior_door, door_thickness] }, provenance: [*ed], status: draft }
  - { id: type.door.generic_wet_room, family: family.door.hinged, name: Wet-room door, params: { element_type: door, door_kind: interior, height: 2.1, thickness: 0.06, material_id: wood, frame_material_id: window_frame, default_width: 0.8 }, derived_from: { layout_config: [wet_room_door, door_thickness] }, provenance: [*ed], status: draft }
  - { id: type.door.generic_sliding, family: family.door.hinged, name: Sliding glass door, params: { element_type: door, door_kind: sliding, height: 2.4, thickness: 0.06, material_id: glass, frame_material_id: window_frame, default_width: 2.4 }, derived_from: { layout_config: [sliding_door, door_thickness] }, provenance: [*ed], status: draft }
  - { id: type.door.generic_garage, family: family.door.hinged, name: Garage door, params: { element_type: door, door_kind: garage, height: 2.2, thickness: 0.06, material_id: metal, frame_material_id: window_frame, width_per_car: 2.5 }, derived_from: { layout_config: [garage_door_height, garage_door_width_per_car, door_thickness] }, provenance: [*ed], status: draft }
  # Windows
  - { id: type.window.generic_standard, family: family.window.basic, name: Standard window, params: { element_type: window, material_id: glass, frame_material_id: window_frame, default_sill: 0.9, default_height: 1.4, glazing_ratio: 0.16, mullion_spacing: 1.0 }, derived_from: { layout_config: [window_presets.standard] }, provenance: [*ed], status: draft }
  - { id: type.window.generic_large, family: family.window.basic, name: Large window, params: { element_type: window, material_id: glass, frame_material_id: window_frame, default_sill: 0.6, default_height: 1.8, glazing_ratio: 0.22, mullion_spacing: 1.2 }, derived_from: { layout_config: [window_presets.large] }, provenance: [*ed], status: draft }
  - { id: type.window.generic_panoramic, family: family.window.basic, name: Panoramic window, params: { element_type: window, material_id: glass, frame_material_id: window_frame, default_sill: 0.1, default_height: 2.4, glazing_ratio: 0.3, mullion_spacing: 1.4 }, derived_from: { layout_config: [window_presets.panoramic] }, provenance: [*ed], status: draft }
  - { id: type.window.generic_service, family: family.window.basic, name: Service-room window, params: { element_type: window, material_id: glass, frame_material_id: window_frame, default_sill: 1.5, default_height: 0.6, default_width: 0.8 }, derived_from: { layout_config: [service_window] }, provenance: [*ed], status: draft }
  - { id: type.window.generic_stair, family: family.window.basic, name: Stair window, params: { element_type: window, material_id: glass, frame_material_id: window_frame, default_sill: 1.0, default_height: 1.2 }, derived_from: { layout_config: [stair_window] }, provenance: [*ed], status: draft }
  # Stairs and railings
  - { id: type.stair.generic_straight_1000, family: family.stair.straight, name: Straight stair 1000, params: { element_type: stair, stair_type: straight, width: 1.0, material_id: wood }, derived_from: { layout_config: [stair_width] }, provenance: [*ed], status: draft }
  - { id: type.railing.generic_stair, family: family.railing.basic, name: Stair railing, params: { element_type: railing, railing_kind: bars, height: 0.9, post_spacing: 1.0, material_id: metal }, derived_from: { layout_config: [stair_railing_height, railing_post_spacing] }, provenance: [*ed], status: draft }
  - { id: type.railing.generic_balcony, family: family.railing.basic, name: Balcony railing, params: { element_type: railing, railing_kind: glass, height: 1.1, post_spacing: 1.0, material_id: metal }, derived_from: { layout_config: [balcony_railing_height, railing_post_spacing] }, provenance: [*ed], status: draft }

