# core@1 canonical glossary (docs/knowledge.md §3.3).
#
# Canonical, language-neutral term ids with English wording. English terms and definitions are
# BuildAI editorial work; locale-specific wordings (e.g. Russian terms taken from a source)
# live in scoped packs as `localized` entries that point at these ids.
terms:
  # Building model
  - { id: term.building, preferred: building, class_ref: class.building, provenance: [&ed { source: buildai-editorial, supports: [term, definition] }], status: draft }
  - { id: term.storey, preferred: storey, synonyms: [floor, level], class_ref: class.storey, definition: "One level of a building, measured floor to floor.", provenance: [*ed], status: draft }
  - { id: term.storey_height, preferred: storey height, synonyms: [floor-to-floor height], definition: "Distance from the finished floor of a storey to the finished floor of the storey above.", provenance: [*ed], status: draft }
  - { id: term.coordination_axis, preferred: coordination axis, synonyms: [grid line], class_ref: class.coordination_axis, definition: "Reference line locating the main load-bearing walls and columns in plan.", provenance: [*ed], status: draft }
  - { id: term.bay, preferred: bay, synonyms: [axis spacing], definition: "Distance between two adjacent coordination axes.", provenance: [*ed], status: draft }
  - { id: term.span, preferred: span, definition: "Distance between coordination axes in the direction the main floor or roof structure spans.", provenance: [*ed], status: draft }
  - { id: term.basic_module, preferred: basic module, definition: "The unit on which coordinated building dimensions are based.", provenance: [*ed], status: draft }
  - { id: term.modular_coordination, preferred: modular coordination, definition: "Coordinating the dimensions of spaces and elements as multiples of a module.", provenance: [*ed], status: draft }
  - { id: term.construction, preferred: construction, synonyms: [building part], definition: "A part of a building with a specific function, such as a wall or a floor.", provenance: [*ed], status: draft }
  - { id: term.building_product, preferred: building product, synonyms: [prefabricated element], definition: "An element manufactured off site and assembled into the building.", provenance: [*ed], status: draft }
  - { id: term.node, preferred: joint detail, synonyms: [node], definition: "Place where elements meet; also its enlarged detail drawing.", provenance: [*ed], status: draft }

