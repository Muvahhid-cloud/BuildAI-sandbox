  - { id: class.space.utility, label: utility room, kind: space, parent: class.space, model_binding: { room_type: utility }, ifc: { entity: IfcSpace }, provenance: [*ed], status: draft }
  - { id: class.space.storage, label: storage, kind: space, parent: class.space, model_binding: { room_type: storage }, ifc: { entity: IfcSpace }, provenance: [*ed], status: draft }
  - { id: class.space.walk_in_closet, label: walk-in closet, kind: space, parent: class.space, model_binding: { room_type: walk_in_closet }, ifc: { entity: IfcSpace }, provenance: [*ed], status: draft }
