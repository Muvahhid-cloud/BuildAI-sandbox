# Relationship kinds of the canonical model (docs/building-model.md §3.4). Source/target
# classes include their subclasses.
relationships:
  - { id: rel.hosted_by, label: hosted by, model_binding: hosted_by, source_classes: [class.door, class.window], target_classes: [class.wall], per_source: { min: 1, max: 1 }, provenance: [*ed], status: draft }
  - { id: rel.bounds, label: bounds, model_binding: bounds, source_classes: [class.wall], target_classes: [class.space], per_source: { min: 0 }, provenance: [*ed], status: draft }
  - { id: rel.adjacent_to, label: adjacent to, model_binding: adjacent_to, source_classes: [class.space], target_classes: [class.space], per_source: { min: 0 }, provenance: [*ed], status: draft }
  - { id: rel.connects, label: connects, model_binding: connects, source_classes: [class.door], target_classes: [class.space], per_source: { min: 1, max: 2 }, provenance: [*ed], status: draft }
  - { id: rel.supports, label: supports, model_binding: supports, source_classes: [class.wall, class.column, class.beam], target_classes: [class.slab, class.roof], per_source: { min: 0 }, provenance: [*ed], status: draft }
  - { id: rel.located_in, label: located in, model_binding: located_in, source_classes: [class.furniture, class.stair, class.railing], target_classes: [class.space], per_source: { min: 0, max: 1 }, provenance: [*ed], status: draft }
  - { id: rel.serves, label: serves, model_binding: serves, source_classes: [class.mep_element], target_classes: [class.space], per_source: { min: 0 }, reserved: true, provenance: [*ed], status: draft }
  - { id: rel.connected_to, label: connected to, model_binding: connected_to, source_classes: [class.mep_element], target_classes: [class.mep_element], per_source: { min: 0 }, reserved: true, provenance: [*ed], status: draft }
  - { id: rel.part_of_system, label: part of system, model_binding: part_of_system, source_classes: [class.mep_element], target_classes: [class.mep_system], per_source: { min: 0, max: 1 }, reserved: true, provenance: [*ed], status: draft }
