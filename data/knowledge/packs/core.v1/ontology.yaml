  - { id: class.space.open_kitchen_living, label: open kitchen and living, kind: space, parent: class.space, model_binding: { room_type: open_kitchen_living }, ifc: { entity: IfcSpace }, provenance: [*ed], status: draft }
  - { id: class.space.bedroom, label: bedroom, kind: space, parent: class.space, model_binding: { room_type: bedroom }, ifc: { entity: IfcSpace }, provenance: [*ed], status: draft }
