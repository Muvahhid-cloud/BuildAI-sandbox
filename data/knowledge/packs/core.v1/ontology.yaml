  - { id: class.pipeline, label: pipeline, kind: element, parent: class.mep_element, ifc: { entity: IfcPipeSegment }, provenance: [*systems, *ed], status: extracted }
  - { id: class.riser, label: riser, kind: element, parent: class.pipeline, ifc: null, provenance: [&desig { source: georgievsky-2004, pages: [95], section: "9.2", supports: [existence] }, *ed], status: extracted }
  - { id: class.water_inlet, label: water service inlet, kind: element, parent: class.pipeline, ifc: null, provenance: [*desig, *ed], status: extracted }
  - { id: class.sewer_outlet, label: sewer outlet, kind: element, parent: class.pipeline, ifc: null, provenance: [*desig, *ed], status: extracted }
  - { id: class.pipe_fitting, label: valve or tap (pipeline fitting), kind: element, parent: class.mep_element, ifc: { entity: IfcValve }, provenance: [*systems, *ed], status: extracted }
  - { id: class.sanitary_fixture, label: sanitary fixture, kind: element, parent: class.mep_element, ifc: { entity: IfcSanitaryTerminal }, provenance: [*systems, *ed], status: extracted }
  - { id: class.mep_equipment, label: building services equipment, kind: element, parent: class.mep_element, ifc: null, provenance: [*systems, *ed], status: extracted }
