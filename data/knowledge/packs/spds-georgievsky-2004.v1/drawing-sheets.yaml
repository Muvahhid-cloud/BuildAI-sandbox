# Drawing knowledge, part 1: sets, sheets, scales, lines, fonts, hatching, dimensions, slopes.
# Grouped by the `spds` drawing profile (drawing-profile.yaml). Paper-space sizes are
# millimetres on the sheet (`_paper_mm`); line weights relative to the main line S use `_s`.
# The book's figures and patterns are not reproduced — only meanings and parameters.
items:
  - id: drawing.sets.marks
    kind: code_list
    category: drawing
    concept: marks of working-drawing sets
    statement: >-
      Working drawings are grouped into sets identified by marks, one per discipline, such as
      site plan, architectural solutions, reinforced-concrete, metal and timber structures,
      water and sewer, heating and ventilation, power, lighting, gas and automation.
    params:
      marks:
        - { mark: "ГТ", en: site plan and transport }
        - { mark: "ГП", en: site plan }
        - { mark: "АР", en: architectural solutions, layers: [architecture] }
        - { mark: "АС", en: architectural and structural solutions, layers: [architecture, structure] }
        - { mark: "АИ", en: interiors }
        - { mark: "КЖ", en: reinforced-concrete structures, layers: [structure] }
        - { mark: "КМ", en: metal structures, layers: [structure] }
        - { mark: "КМД", en: metal structures detailing }
        - { mark: "КД", en: timber structures, layers: [structure] }
        - { mark: "ВК", en: internal water supply and sewerage, layers: [plumbing] }
        - { mark: "НВК", en: external water and sewer networks }
        - { mark: "ОВ", en: heating ventilation and air conditioning, layers: [hvac] }
        - { mark: "ТС", en: heat networks }
        - { mark: "ГС", en: gas supply }
        - { mark: "ЭС", en: power supply, layers: [electrical] }
        - { mark: "ЭО", en: electric lighting, layers: [electrical] }
        - { mark: "А", en: automation }
    provenance:
      - { source: georgievsky-2004, pages: [7, 8], section: "2.2", cites: ["ГОСТ 21.101-97"], supports: [statement, params] }
      - { source: buildai-editorial, supports: [mapping], note: "The mapping to BuildAI discipline layers is editorial." }
    confidence: high
    intended_use: [documentation.sets]
    status: extracted

  - id: drawing.sets.designation
    kind: convention
    category: drawing
    concept: set designation
    statement: >-
      A set is designated by the base document designation followed by a hyphen and the set
      mark; a large set may be split into numbered sets of the same mark. The first sheets of
      each set carry its general data.
    provenance: [{ source: georgievsky-2004, pages: [5], section: "1.3" }]
    confidence: high
    intended_use: [documentation.sets]
    status: extracted

  - id: drawing.sets.architectural_contents
    kind: content_list
    category: drawing
    concept: contents of the architectural set
    statement: >-
      The basic architectural set contains general data, floor plans (including basement,
      technical floors and attic), sections, facades, floor-finish plans when needed, the roof
      plan, arrangement schemes of partitions and opening infills, callout details and
      fragments, and schedules for the arrangement schemes.
    params:
      sheets: [general_data, floor_plans, sections, facades, floor_finish_plans, roof_plan, partition_schemes, opening_infill_schemes, callouts, schedules]
    provenance: [{ source: georgievsky-2004, pages: [68, 69], section: "6.1", cites: ["ГОСТ 21.501-93"] }]
    confidence: high
    intended_use: [documentation.sets.architectural]
    related: [term.floor_plan, term.section, term.facade, term.roof_plan]
    status: extracted

  - id: drawing.sheet.formats
    kind: dimension_table
    category: drawing
    concept: sheet formats and frame margins
    statement: >-
      Drawings use the A-series formats A0 to A4, measured on the outer frame; the inner frame
      is 20 mm from the left edge and 5 mm from the other edges.
    params:
      formats:
        - { format: A0, width_paper_mm: 841, height_paper_mm: 1189 }
        - { format: A1, width_paper_mm: 594, height_paper_mm: 841 }
        - { format: A2, width_paper_mm: 420, height_paper_mm: 594 }
        - { format: A3, width_paper_mm: 297, height_paper_mm: 420 }
        - { format: A4, width_paper_mm: 210, height_paper_mm: 297 }
      frame_margin_left_paper_mm: 20
      frame_margin_other_paper_mm: 5
    provenance: [{ source: georgievsky-2004, pages: [17, 18], section: "3.1", tables: ["Табл. 1"], cites: ["ГОСТ 2.301-68"], supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.sheets]
    status: extracted

  - id: drawing.sheet.title_block
    kind: convention
    category: drawing
    concept: title block
    statement: >-
      Every sheet carries a title block in the lower right corner (along the short side on A4).
      Different forms are used for first sheets of drawings, product drawings, text documents
      and subsequent sheets; the main drawing form is 185 x 55 mm and the subsequent-sheet form
      185 x 15 mm.
    params:
      main_form_paper_mm: { width: 185, height: 55 }
      subsequent_form_paper_mm: { width: 185, height: 15 }
      position: bottom_right
    provenance: [{ source: georgievsky-2004, pages: [18, 19, 20, 21], section: "3.2", cites: ["ГОСТ 21.101-97"], supports: [statement, params] }]
    confidence: medium
    inferences: ["The book shows the student variant of the fields; production field lists need checking against the standard."]
    intended_use: [documentation.sheets.title_block]
    related: [term.title_block]
    status: extracted

  - id: drawing.general.consistency
    kind: convention
    category: drawing
    concept: consistency across the drawings of a building
    statement: >-
      The plan orientation, axis marking and zero level are the same on every drawing of a
      building. The scale is not written on building drawings except product drawings. When a
      facade, plan and section share a sheet, the plan goes under the facade and the section to
      its right.
    provenance: [{ source: georgievsky-2004, pages: [14, 16], section: "2.6" }]
    confidence: high
    intended_use: [documentation.sheets.layout]
    status: extracted

  - id: drawing.scales.standard_series
    kind: code_list
    category: drawing
    concept: standard scales
    statement: Drawings use scales from a standard series of reduction and enlargement ratios.
    params:
      reduction_scales: ["1:2", "1:2.5", "1:4", "1:5", "1:10", "1:15", "1:20", "1:25", "1:40", "1:50", "1:75", "1:100", "1:200", "1:400", "1:500", "1:800", "1:1000"]
      enlargement_scales: ["2:1", "2.5:1", "4:1", "5:1", "10:1", "20:1", "40:1", "50:1", "100:1"]
    provenance: [{ source: georgievsky-2004, pages: [22], section: "3.3", cites: ["ГОСТ 2.302-68"], supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.scales]
    status: extracted

  - id: drawing.scales.by_view
    kind: convention
    category: drawing
    concept: scales by kind of building drawing
    statement: >-
      Floor plans, sections and facades are drawn at 1:100 to 1:500 (1:50 for dense content);
      roof, floor-finish and technical-floor plans at 1:500 to 1:1000 (or 1:200); plan and
      facade fragments at 1:100 (or 1:50); details at 1:10 or 1:20 (or 1:5).
    params:
      plans_sections_facades_scales: ["1:100", "1:200", "1:400", "1:500"]
      plans_sections_facades_allowed_scales: ["1:50"]
      roof_and_floor_plans_scales: ["1:500", "1:800", "1:1000"]
      roof_and_floor_plans_allowed_scales: ["1:200"]
      fragments_scales: ["1:100"]
      fragments_allowed_scales: ["1:50"]
      details_scales: ["1:10", "1:20"]
      details_allowed_scales: ["1:5"]
    provenance: [{ source: georgievsky-2004, pages: [22], section: "3.3", tables: ["Табл. 2"], cites: ["ГОСТ 21.501-93"], supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.scales]
    status: extracted

  - id: drawing.lines.types
    kind: convention
    category: drawing
    concept: line types and their uses
    statement: >-
      Line weights are set relative to a main solid line S of 0.5 to 1.4 mm. Thick solid lines
      show visible contours and sections; thin solid lines dimension, extension, leader and
      hatch lines; dashed lines hidden contours; thin dash-dot lines axes; thickened dash-dot
      lines treated surfaces; open lines section planes; wavy and zigzag lines breaks;
      dash-double-dot lines folds and moving parts.
    params:
      main_line_paper_mm: { min: 0.5, max: 1.4 }
      types_s:
        - { type: solid_thick, min: 1.0, max: 1.0, uses: [visible_contours, section_contours] }
        - { type: solid_thin, min: 0.333, max: 0.5, uses: [dimension_lines, extension_lines, hatching, leaders] }
        - { type: solid_wavy, min: 0.333, max: 0.5, uses: [break_lines] }
        - { type: dashed, min: 0.333, max: 0.5, uses: [hidden_contours], dash_paper_mm: [2, 8], gap_paper_mm: [1, 2] }
        - { type: dash_dot_thin, min: 0.333, max: 0.5, uses: [axes, centre_lines], dash_paper_mm: [5, 30], gap_paper_mm: [3, 5] }
        - { type: dash_dot_thickened, min: 0.5, max: 0.667, uses: [treated_surfaces, elements_before_cut_plane], dash_paper_mm: [3, 8], gap_paper_mm: [3, 4] }
        - { type: open, min: 1.0, max: 1.5, uses: [section_planes], dash_paper_mm: [8, 20] }
        - { type: solid_thin_zigzag, min: 0.333, max: 0.5, uses: [long_break_lines] }
        - { type: dash_double_dot_thin, min: 0.333, max: 0.5, uses: [fold_lines, moving_parts], dash_paper_mm: [5, 30], gap_paper_mm: [4, 6] }
    provenance: [{ source: georgievsky-2004, pages: [22, 23, 24, 25], section: "3.4", tables: ["Табл. 3"], cites: ["ГОСТ 2.303-68"], supports: [statement, params] }]
    confidence: high
    inferences: ["Fractions of S (S/3, S/2, 2S/3) are written as decimals."]
    intended_use: [documentation.style.lines]
    status: extracted

  - id: drawing.lines.window_sash_opening
    kind: convention
    category: drawing
    concept: window sash opening lines
    statement: >-
      The opening sign of a window sash is a thin solid line when the sash opens outward and a
      dashed line when it opens inward.
    provenance: [{ source: georgievsky-2004, pages: [24], section: "3.4", tables: ["Табл. 3"] }]
    confidence: high
    intended_use: [documentation.symbols.openings]
    status: extracted

  - id: drawing.lines.weights_by_scale
    kind: dimension_table
    category: drawing
    concept: line weights on plans, sections and facades by scale
    statement: >-
      Recommended weights at 1:200, 1:100 and 1:50: ground line 0.6/0.8/0.8 mm; cut stone and
      timber elements 0.3-0.4/0.4-0.5/0.5-0.6 mm; opening outlines 0.3/0.4/0.4 mm; frames, sashes
      and leaves 0.2/0.2/0.2-0.3 mm. Facade building contours use the weights of cut elements.
    params:
      weights_paper_mm:
        - { element: ground_line, at_1_200: 0.6, at_1_100: 0.8, at_1_50: 0.8 }
        - { element: cut_stone_and_timber, at_1_200: [0.3, 0.4], at_1_100: [0.4, 0.5], at_1_50: [0.5, 0.6] }
        - { element: openings, at_1_200: 0.3, at_1_100: 0.4, at_1_50: 0.4 }
        - { element: frames_sashes_leaves, at_1_200: 0.2, at_1_100: 0.2, at_1_50: [0.2, 0.3] }
    provenance: [{ source: georgievsky-2004, pages: [26, 27], section: "3.4", tables: ["Табл. 5", "Табл. 6"], supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.style.lines]
    status: extracted

  - id: drawing.lines.minimum_thickness
    kind: dimension_table
    category: drawing
    concept: minimum line thickness and spacing
    statement: >-
      The minimum line thickness and the minimum distance between parallel lines depend on the
      sheet size and on whether the drawing is inked or in pencil.
    params:
      ink_min_thickness_paper_mm: 0.2
      pencil_min_thickness_paper_mm: 0.3
      ink_min_spacing_paper_mm: 0.8
      pencil_min_spacing_paper_mm: 1.0
    provenance: [{ source: georgievsky-2004, pages: [26], section: "3.4", tables: ["Табл. 4"], supports: [statement, params] }]
    confidence: medium
    inferences: ["The split of values between sheet sizes is only partly legible; the values given are those read for the larger formats."]
    status: needs_verification

  - id: drawing.fonts.sizes
    kind: convention
    category: drawing
    concept: font sizes
    statement: >-
      Lettering uses standard heights of 2.5 to 40 mm. Axis and position marks are one or two
      sizes larger than the dimension figures on the same drawing.
    params:
      font_heights_paper_mm: [2.5, 3.5, 5, 7, 10, 14, 20, 28, 40]
      axis_mark_size_step_count: [1, 2]
    provenance:
      - { source: georgievsky-2004, pages: [27], section: "3.5", cites: ["ГОСТ 2.304-81"], supports: [statement, params] }
      - { source: georgievsky-2004, pages: [45], section: "4.2", supports: [statement] }
    confidence: high
    intended_use: [documentation.style.text]
    status: extracted

  - id: drawing.hatch.section_materials
    kind: symbol_set
    category: drawing
    concept: material designations in sections
    statement: >-
      Cut sections are hatched by material category: metals; non-metallic materials; wood;
      natural stone; ceramic and silicate masonry; concrete; reinforced and prestressed
      concrete; glass; liquids; natural soil; fills, plasters and gypsum; waterproofing; sound
      and thermal insulation.
    params:
      categories: [metal, non_metallic, wood, natural_stone, ceramic_masonry, concrete, reinforced_concrete, prestressed_concrete, glass, liquid, natural_soil, fill_plaster_gypsum, waterproofing, sound_insulation, thermal_insulation]
    provenance: [{ source: georgievsky-2004, pages: [29, 30, 31], section: "3.6", tables: ["Табл. 7"], cites: ["ГОСТ 2.306-68"] }]
    confidence: medium
    inferences: ["Category keys are BuildAI names; the patterns themselves are not stored."]
    intended_use: [documentation.style.hatching]
    status: extracted

  - id: drawing.hatch.facade_materials
    kind: symbol_set
    category: drawing
    concept: material designations on facades
    statement: >-
      On facades materials may be indicated for metals, corrugated and expanded steel, brick and
      stone masonry, and glass, either fully or only in patches along the contour.
    params:
      categories: [metal, corrugated_steel, expanded_steel, masonry, glass]
    provenance: [{ source: georgievsky-2004, pages: [32], section: "3.6", tables: ["Табл. 8"] }]
    confidence: high
    intended_use: [documentation.style.hatching]
    status: extracted

  - id: drawing.hatch.rules
    kind: convention
    category: drawing
    concept: hatching rules
    statement: >-
      Hatch lines run at 45 degrees to the frame, in one direction for all sections of a part,
      spaced 1 to 10 mm by area; adjacent parts are hatched in opposite directions or with
      different spacing; glass at 15-20 degrees; sections narrower than 2 mm may be filled solid
      with gaps of at least 0.8 mm; large areas may be hatched only along the contour.
    params:
      hatch_angle_deg: 45
      glass_hatch_angle_deg: [15, 20]
      spacing_paper_mm: [1, 10]
      narrow_section_fill_below_paper_mm: 2
      fill_gap_min_paper_mm: 0.8
    provenance: [{ source: georgievsky-2004, pages: [32, 33, 34, 35], section: "3.6", supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.style.hatching]
    status: extracted

  - id: drawing.dimensions.lines
    kind: convention
    category: drawing
    concept: dimension lines
    statement: >-
      Dimensions on building drawings form closed chains of thin lines, 6 to 10 mm apart and at
      least 10 mm from the outer contour of plans, sections and facades, ending in 2-4 mm ticks
      at 45 degrees and running 1-3 mm past the outermost extension lines; extension lines run
      1-5 mm past the dimension line.
    params:
      chain: closed
      line_spacing_paper_mm: [6, 10]
      first_line_offset_min_paper_mm: 10
      tick_length_paper_mm: [2, 4]
      tick_angle_deg: 45
      overrun_paper_mm: [1, 3]
      extension_overrun_paper_mm: [1, 5]
    provenance: [{ source: georgievsky-2004, pages: [35, 36], section: "3.7", cites: ["ГОСТ 2.307-68"], supports: [statement, params] }]
    confidence: high
    intended_use: [documentation.dimensions]
    status: extracted

  - id: drawing.slope
    kind: convention
    category: drawing
    concept: slope notation
    statement: >-
      A slope is the ratio of rise to run. On views and sections it is written with an angle sign
      pointing down the slope, above the contour or on a leader; on plans the direction is an
      arrow, with the value when needed, as a fraction or a decimal to three places.
    params: { decimal_places_count: 3 }
    provenance: [{ source: georgievsky-2004, pages: [39, 40], section: "3.8" }]
    confidence: high
    intended_use: [documentation.roof_plan.slopes]
    related: [term.slope]
    status: extracted
