#
# One documented source among future ones. It describes Russian/CIS (ESKD/SPDS) drafting
# practice as of 2004 and is scoped as the `spds` drawing-convention profile — it is NOT a
# global architectural standard and NOT a construction-code engine.
# The document itself is not stored in the repository; knowledge from it is paraphrased with
# printed-page provenance. Page numbers in citations are PRINTED page numbers.
